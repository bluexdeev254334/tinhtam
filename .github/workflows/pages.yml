name: Deploy Tĩnh Tâm to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          TINH_TAM_API_URL: https://tinh-tam-api-bluexdeev254334.onrender.com
        run: |
          mkdir -p _site
          cp public/index.html public/app.js public/style.css _site/
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const api = new URL(process.env.TINH_TAM_API_URL);
            if (api.protocol !== "https:") throw new Error("The API URL must use HTTPS.");
            writeFileSync("_site/config.js", `window.TINH_TAM_API_BASE = ${JSON.stringify(api.origin)};\n`);
          '
          if [ -d public/audio ]; then cp -R public/audio _site/audio; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
